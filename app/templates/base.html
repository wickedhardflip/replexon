<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RePlexOn{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo/replexon-sign.svg">
    <link rel="stylesheet" href="/static/css/style.css?v=6">
    <link rel="stylesheet" href="/static/css/theme.css?v=6">
    <script>
        (function() {
            try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
        })();
    </script>
    <script src="/static/js/htmx.min.js" defer></script>
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}
    <nav class="top-nav">
        <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">&#9776;</button>
        <a href="/dashboard" class="nav-brand">
            <img class="brand-sign" src="/static/logo/replexon-sign.svg" alt="RePlexOn">
        </a>

        <ul class="nav-links" id="nav-links">
            <li>
                <a href="/dashboard" class="{{ 'active' if active_page == 'dashboard' }}">
                    <span class="nav-icon">&#9632;</span>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/logs" class="{{ 'active' if active_page == 'logs' }}">
                    <span class="nav-icon">&#9776;</span>
                    <span>Logs</span>
                </a>
            </li>
            <li>
                <a href="/schedules" class="{{ 'active' if active_page == 'schedules' }}">
                    <span class="nav-icon">&#9202;</span>
                    <span>Schedules</span>
                </a>
            </li>
            <li>
                <a href="/restore" class="{{ 'active' if active_page == 'restore' }}">
                    <span class="nav-icon">&#8635;</span>
                    <span>Restore</span>
                </a>
            </li>
            <li>
                <a href="/settings" class="{{ 'active' if active_page == 'settings' }}">
                    <span class="nav-icon">&#9881;</span>
                    <span>Settings</span>
                </a>
            </li>
        </ul>

        <div class="nav-right">
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button>
            <div class="nav-user">
                <span class="username">{{ user.username if user else '' }}</span>
                <form method="post" action="/logout" style="display:inline;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit" class="logout-btn">Sign out</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}

    <script src="/static/js/app.js?v=7"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
